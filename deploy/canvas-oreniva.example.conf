# Nginx example for the standalone canvas container.
# Replace the certificate paths and upstream address for the target host.

server {
    listen 443 ssl http2;
    server_name canvas.oreniva.com;

    ssl_certificate /etc/letsencrypt/live/canvas.oreniva.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/canvas.oreniva.com/privkey.pem;

    add_header Content-Security-Policy "frame-ancestors https://oreniva.com" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header X-Frame-Options;
    }
}

server {
    listen 80;
    server_name canvas.oreniva.com;
    return 301 https://$host$request_uri;
}
